description: 'Sansan, Inc. is a Tokyo-based enterprise SaaS company that builds cloud contact- and
  business-card management software. Its flagship Sansan platform digitizes and centralizes business
  cards and customer contact data so sales teams can share information across the organization, surface
  opportunities, and integrate contact data with external systems. The company also offers the Eight
  business-card app and Bill One invoice-management product. As of this enrichment pass Sansan does not
  publish a public developer portal, API reference, or OpenAPI definition on its English or Japanese
  websites; this profile captures the company identity and probed domain-security posture only.'
